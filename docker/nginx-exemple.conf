# Exemple de reverse proxy nginx : https://genealogie.example.org → conteneur Tabularium (port 3000).
# Adapter le chemin des certificats (Let's Encrypt / certbot) et l'adresse du serveur si nginx tourne ailleurs.

server {
    listen 80;
    server_name genealogie.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name genealogie.example.org;

    ssl_certificate     /etc/letsencrypt/live/genealogie.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genealogie.example.org/privkey.pem;

    # Restauration d'une sauvegarde complète (base + images)
    client_max_body_size 2g;

    # Site privé : jamais indexé
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Mise à jour en direct (Server-Sent Events) : pas de mise en mémoire tampon, connexion longue
    location /api/evenements {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
